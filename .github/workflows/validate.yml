name: Skills validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install 'PyYAML==6.0.3' 'markdown-it-py==4.0.0'
      - name: Validate skill metadata and local references
        run: python skills/self-improve-skills/scripts/audit_skills.py --root skills --no-config
      - name: Validate evaluation datasets
        run: >-
          python skills/self-improve-skills/scripts/skill_evals.py validate
          skills/mistake-notebook/evals/cases.json
          skills/self-improve-skills/evals/cases.json
      - name: Check public code-master content
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          private = re.compile(
              r"bytedance|bytedcli|code\.byted|bits\.byted|bnpm\.|"
              r"agentbuddy|fluxcr|AgenticReviewExecutor|CODEBASE_JWT|CLOUD_JWT|"
              r"query_spec_skills|satcheck|optimus\.",
              re.IGNORECASE,
          )
          found = []
          for path in Path("skills/code-master").rglob("*"):
              if path.is_file():
                  for line, text in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                      if private.search(text):
                          found.append(f"{path}:{line}")
          if found:
              raise SystemExit("Private platform content found: " + ", ".join(found))
          print("Public code-master content check passed")
          PY
